[package]
name = "yaak"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
chrono = { workspace = true }
log = { workspace = true }
md5 = "0.8.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
